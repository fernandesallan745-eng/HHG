<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Note — Apple Inspired Note Taking</title>
  <meta name="description" content="A fluid, Apple Human Interface Guidelines-inspired voice and text note taking app with instant speech recognition, automatic tagging, and local persistence.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-wrapper">
    <!-- Apple Style Header -->
    <header class="app-header">
      <div class="header-action-bar">
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" title="Toggle Light / Dark mode" aria-label="Toggle theme">
          <!-- Sun Icon (visible in dark mode) -->
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon Icon (visible in light mode) -->
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>

      <div class="brand">
        <div class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="app-title">Voice Note</h1>
          <p class="app-subtitle">Capture thoughts effortlessly with voice or text</p>
        </div>
      </div>
    </header>

    <main>
      <!-- Apple Liquid Glass Note Composer Card -->
      <section class="editor-card glass-panel" aria-label="Compose a new note">
        <div class="editor-toolbar">
          <span class="editor-label">New Note</span>
          <button id="clearBtn" class="btn-ghost" type="button" title="Clear note draft">Clear</button>
        </div>

        <div class="input-container">
          <textarea 
            id="noteInput" 
            placeholder="Type your note here or click 'Dictate' to speak..." 
            rows="5"
            spellcheck="true"
          ></textarea>
        </div>

        <div class="editor-footer">
          <div class="stats" id="charCount">0 characters</div>
          <div class="editor-footer-actions">
            <!-- Fallback message when Web Speech API is unsupported -->
            <span id="speechUnsupportedMsg" class="speech-unsupported-msg" style="display: none;">
              Speech recognition not supported in this browser
            </span>

            <!-- Microphone speech recognition button next to save button -->
            <button id="micBtn" class="btn-mic" type="button" title="Start voice dictation" aria-label="Voice dictation">
              <span class="mic-pulsing-dot" id="micPulsingDot" aria-hidden="true"></span>
              <svg class="mic-icon-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="8" y1="22" x2="16" y2="22"/>
              </svg>
              <span id="micBtnText">Dictate</span>
            </button>

            <!-- Save Note Button -->
            <button id="saveBtn" class="btn-apple-primary" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              <span>Save Note</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Notes Section with Apple Segmented Controls & Search Field -->
      <section class="notes-section" aria-label="Notes collection">
        <div class="notes-header">
          <div class="notes-header-left">
            <h2 class="section-title">Saved Notes</h2>
            <span class="counter-capsule" id="notesBadge">0</span>
          </div>
          <div class="sort-control">
            <label for="sortSelect" class="sort-label" title="Sort notes">
              <svg class="sort-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="4" y1="12" x2="15" y2="12"/>
                <line x1="4" y1="18" x2="10" y2="18"/>
              </svg>
              <span>Sort:</span>
            </label>
            <div class="select-wrapper">
              <select id="sortSelect" class="apple-select" aria-label="Sort notes">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="tag">By tag</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- iOS Style Search Field -->
        <div class="search-bar-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search notes by keyword or type (study, work, ideas, personal)..." 
            autocomplete="off"
            aria-label="Search notes"
          >
          <button id="searchClearBtn" class="search-clear-btn" type="button" title="Clear search" aria-label="Clear search input">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Apple Segmented Control Filter Row -->
        <div class="segmented-control" id="tagFilters" role="tablist" aria-label="Filter notes by category">
          <button class="segment-btn active" data-tag="all" type="button" role="tab" aria-selected="true">
            <span>All</span>
            <span class="segment-count" id="count-all">0</span>
          </button>
          <button class="segment-btn seg-study" data-tag="study" type="button" role="tab" aria-selected="false">
            <span class="seg-dot"></span>
            <span>Study</span>
            <span class="segment-count" id="count-study">0</span>
          </button>
          <button class="segment-btn seg-work" data-tag="work" type="button" role="tab" aria-selected="false">
            <span class="seg-dot"></span>
            <span>Work</span>
            <span class="segment-count" id="count-work">0</span>
          </button>
          <button class="segment-btn seg-ideas" data-tag="ideas" type="button" role="tab" aria-selected="false">
            <span class="seg-dot"></span>
            <span>Ideas</span>
            <span class="segment-count" id="count-ideas">0</span>
          </button>
          <button class="segment-btn seg-personal" data-tag="personal" type="button" role="tab" aria-selected="false">
            <span class="seg-dot"></span>
            <span>Personal</span>
            <span class="segment-count" id="count-personal">0</span>
          </button>
        </div>

        <!-- Dynamic Note Cards List -->
        <div id="notesList" class="notes-list" role="feed" aria-busy="false">
          <!-- Cards rendered dynamically -->
        </div>

        <!-- Empty state placeholder -->
        <div id="emptyState" class="empty-state glass-subtle" role="status">
          <div class="empty-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <h3 class="empty-title">No notes yet</h3>
          <p class="empty-desc">Type a thought above or tap Dictate to speak, then hit Save Note.</p>
        </div>
      </section>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
      <p class="footer-text">Built with Wispr Flow for Hacker House Goa 2026.</p>
    </footer>
  </div>

  <!-- Apple Style Toast Notification (Dynamic Capsule) -->
  <div id="toast" class="toast-capsule" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
